spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/db_passwords
    username: 'sa-password-service'
    password: 'P@ssw0rdP@ssw0rds'
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    virtual-host: vhost-password-manager
    username: password-service-pm
    password: password-service-pm-P@ss
  session:
    store-type: none
  flyway:
    enabled: true
    driver-class-name: org.postgresql.Driver
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    schemas:
      - 'public'
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false
  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://127.0.0.1:8080/mypass-manager/auth/
storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:http://127.0.0.1:9000}
    region: ${STORAGE_S3_REGION:us-east-1}
    bucket: ${STORAGE_S3_BUCKET:mhp-files}
    access-key: ${STORAGE_S3_ACCESS_KEY:password-service}
    secret-key: ${STORAGE_S3_SECRET_KEY:MHPasswordManagerPasswordService2026}
    path-style-access: ${STORAGE_S3_PATH_STYLE_ACCESS:true}
management:
  endpoint:
    health:
      group:
        database:
          show-components: always
          show-details: always
          include:
            - db
    shutdown:
      enabled: false
  endpoints:
    web:
      exposure:
        include:
          - 'health'
          - 'metrics'
          - 'info'
springdoc:
  swagger-ui:
    oauth2-redirect-url: http://127.0.0.1:8080/mypass-manager/passwords/swagger-ui/redirect
    csrf:
      enabled: false
